:root {
  --th-canvas: #f1faee;
  --th-surface: #fff;
  --th-surface-alt: #f4fbf6;
  --th-recessed: #dfefef;
  --th-border: #a8dadc;
  --th-ink: #1a2332;
  --th-muted: #415c6b;
  --th-primary: #2d8b8b;
  --th-primary-hover: #226f6f;
  --th-primary-fg: #fff;
  --th-accent-text: #1e6e6e;
  --th-soft-bg: #e1f4f4;
  --th-soft-border: #7bc3c5;
  --th-secondary-bg: #1a2332;
  --th-secondary-fg: #f1faee;
  --th-warm: #1a2332;
  --th-warm-fg: #f1faee;
  --th-warm-soft-bg: #e8f3ef;
  --th-warm-soft-border: #a8dadc;
  --th-kick: #1a2332;
  --th-snare: #2d8b8b;
  --th-closed-hat: #4ba3a5;
  --th-open-hat: #1e5b70;
  --th-waveform: #2d8b8b;
  --th-slider-track: #c7e5e6;
  --th-slider-thumb: #1a2332;
  --th-slider-thumb-border: #fff;
  --th-select-bg: #f1faee;
}

input[type="range"].studio-slider {
  appearance: none;
  background: var(--th-slider-track);
  cursor: pointer;
  border-radius: 3px;
  outline: none;
  height: 6px;
}

input[type="range"].studio-slider::-webkit-slider-thumb {
  appearance: none;
  background: var(--th-slider-thumb);
  border: 1.5px solid var(--th-slider-thumb-border);
  border-radius: 3px;
  width: 15px;
  height: 15px;
  transition: transform .12s cubic-bezier(.16, 1, .3, 1);
  box-shadow: 0 1px 2px #11161f40;
}

input[type="range"].studio-slider:hover::-webkit-slider-thumb {
  transform: scale(1.1);
}

input[type="range"].studio-slider:focus-visible {
  outline: 2px solid var(--th-primary);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, :before, :after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
